name: Tauri MCP E2E Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/thermaltrue?sslmode=disable
  DEFAULT_ADMIN_PASSWORD: admin123
  TAURI_APP_PATH: ${{ github.workspace }}\src-tauri\target\debug\app.exe

jobs:
  test-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: choco install -y mingw

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (debug, no bundle)
        run: npx tauri build --debug --no-bundle
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Cache tests dependencies
        uses: actions/cache@v4
        with:
          path: tests/node_modules
          key: ${{ runner.os }}-tests-${{ hashFiles('tests/package-lock.json') }}

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Setup PostgreSQL (embedded)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pgUser = "pguser"
          $pgPass = "ThermalPG#2026"
          net user $pgUser $pgPass /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to create local user $pgUser" }
          $pgScript = Join-Path $env:GITHUB_WORKSPACE "tests\pg-start.cjs"
          if (-not (Test-Path $pgScript)) { throw "pg-start.cjs not found at $pgScript" }
          New-Item -ItemType Directory -Path "C:\ProgramData\pg-embed" -Force | Out-Null
          $sec = ConvertTo-SecureString $pgPass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential(".\$pgUser", $sec)
          $node = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "node `"$pgScript`" 1> C:\ProgramData\pg-embed\stdout.log 2> C:\ProgramData\pg-embed\stderr.log" -Credential $cred -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE "tests") -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 5
          if ($node.HasExited) {
            Get-Content "C:\ProgramData\pg-embed\stderr.log" -Tail 30 -ErrorAction SilentlyContinue
            Get-Content "C:\ProgramData\pg-embed\pg-embed.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "node pg process exited early (code $($node.ExitCode))"
          }
          $ok = $false
          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 1
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $r = $c.BeginConnect("127.0.0.1", 5432, $null, $null)
              if ($r.AsyncWaitHandle.WaitOne(1000)) { $c.EndConnect($r); $ok = $true }
              $c.Close()
            } catch {}
            if ($ok) { break }
          }
          if (-not $ok) {
            Get-Content "C:\ProgramData\pg-embed\stderr.log" -Tail 30 -ErrorAction SilentlyContinue
            Get-Content "C:\ProgramData\pg-embed\pg-embed.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "PostgreSQL (embedded) did not start on port 5432"
          }
          Write-Host "PostgreSQL ready (embedded)"

      - name: Build and start backend server
        shell: pwsh
        env:
          RUSTFLAGS: ""
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p server
          if ($LASTEXITCODE -ne 0) { throw "server build failed" }
          $env:PORT = "3000"
          $env:DATABASE_URL = "postgresql://postgres:postgres@127.0.0.1:5432/thermaltrue?sslmode=disable"
          $env:DEFAULT_ADMIN_PASSWORD = "admin123"
          Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE "target\release\server.exe") -ArgumentList "run" -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput (Join-Path $env:TEMP "server.out.log") -RedirectStandardError (Join-Path $env:TEMP "server.err.log") -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:3000/api/health/db" -TimeoutSec 3
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Get-Content (Join-Path $env:TEMP "server.err.log") -Tail 30 -ErrorAction SilentlyContinue
            throw "Backend server did not become healthy on port 3000"
          }
          Write-Host "Backend server healthy on port 3000"

      - name: Start Tauri app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\debug\app.exe"
          if (-not (Test-Path $app)) { throw "app.exe not found at $app" }
          Start-Process -FilePath $app -RedirectStandardOutput (Join-Path $env:TEMP "app.out.log") -RedirectStandardError (Join-Path $env:TEMP "app.err.log") -WindowStyle Hidden
          Start-Sleep -Seconds 10
          Write-Host "Tauri app started"

      - name: Run E2E tests
        working-directory: tests
        run: npm run test:all
        timeout-minutes: 30
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TAURI_APP_PATH: ${{ env.TAURI_APP_PATH }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/results/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/results/screenshots/
          retention-days: 14
