name: Tauri MCP E2E Tests
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/thermaltrue?sslmode=disable
  DEFAULT_ADMIN_PASSWORD: admin123
  TAURI_APP_PATH: ${{ github.workspace }}\target\debug\app.exe

jobs:
  test-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: |
          choco install -y mingw
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          Write-Host "WebView2 Runtime version on runner: $($wv.pv)"
          $msedge = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "WebView2 Application dirs: $($msedge -join ',')"
          try { Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List | Out-String | Write-Host } catch {}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build Tauri app (debug, no bundle)
        run: npx tauri build --debug --no-bundle
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Cache tests dependencies
        uses: actions/cache@v4
        with:
          path: tests/node_modules
          key: ${{ runner.os }}-tests-${{ hashFiles('tests/package-lock.json') }}

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Setup PostgreSQL (embedded)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pgUser = "pguser"
          $pgPass = "ThermalPG#2026"
          net user $pgUser $pgPass /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to create local user $pgUser" }
          $pgScript = Join-Path $env:GITHUB_WORKSPACE "tests\pg-start.cjs"
          if (-not (Test-Path $pgScript)) { throw "pg-start.cjs not found at $pgScript" }
          New-Item -ItemType Directory -Path "C:\ProgramData\pg-embed" -Force | Out-Null
          icacls "C:\ProgramData\pg-embed" /grant "${pgUser}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls grant failed" }
          New-Item -ItemType Directory -Path "C:\ProgramData\pg-embed\tmp" -Force | Out-Null
          $env:TEMP = "C:\ProgramData\pg-embed\tmp"
          $env:TMP = "C:\ProgramData\pg-embed\tmp"
          $native = Join-Path $env:GITHUB_WORKSPACE "tests\node_modules\@embedded-postgres\windows-x64\native"
          if (Test-Path $native) {
            icacls $native /grant "${pgUser}:(OI)(CI)F" /T | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls native grant failed" }
          }
          $sec = ConvertTo-SecureString $pgPass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential(".\$pgUser", $sec)
          $node = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "node `"$pgScript`" 1> C:\ProgramData\pg-embed\stdout.log 2> C:\ProgramData\pg-embed\stderr.log" -Credential $cred -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE "tests") -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 5
          if ($node.HasExited) {
            Get-Content "C:\ProgramData\pg-embed\stderr.log" -Tail 30 -ErrorAction SilentlyContinue
            Get-Content "C:\ProgramData\pg-embed\pg-embed.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "node pg process exited early (code $($node.ExitCode))"
          }
          $ok = $false
          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 1
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $r = $c.BeginConnect("127.0.0.1", 5432, $null, $null)
              if ($r.AsyncWaitHandle.WaitOne(1000)) { $c.EndConnect($r); $ok = $true }
              $c.Close()
            } catch {}
            if ($ok) { break }
          }
          if (-not $ok) {
            Get-Content "C:\ProgramData\pg-embed\stderr.log" -Tail 30 -ErrorAction SilentlyContinue
            Get-Content "C:\ProgramData\pg-embed\pg-embed.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "PostgreSQL (embedded) did not start on port 5432"
          }
          Write-Host "PostgreSQL ready (embedded)"

      - name: Build backend server
        shell: pwsh
        env:
          RUSTFLAGS: ""
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p server
          if ($LASTEXITCODE -ne 0) { throw "server build failed" }

      - name: Rust tests (backend + server)
        shell: pwsh
        env:
          RUSTFLAGS: ""
        run: |
          $ErrorActionPreference = "Stop"
          cargo test -p backend --lib
          if ($LASTEXITCODE -ne 0) { throw "backend tests failed" }
          cargo test -p server
          if ($LASTEXITCODE -ne 0) { throw "server tests failed" }

      - name: Start Tauri app + backend + verify + run E2E (single step)
        shell: pwsh
        env:
          MCP_E2E: "true"
          PORT: "3000"
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DEFAULT_ADMIN_PASSWORD: admin123
          TAURI_APP_PATH: ${{ env.TAURI_APP_PATH }}
          MCP_BRIDGE_PORT: "9223"
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          $logDir = Join-Path $env:GITHUB_WORKSPACE "tests\results"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          # 1) Start backend server (release) di port 3000
          $server = Join-Path $env:GITHUB_WORKSPACE "target\release\server.exe"
          if (-not (Test-Path $server)) { throw "server.exe not found at $server" }
          $srv = Start-Process -FilePath $server -ArgumentList "run" -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput (Join-Path $logDir "server.out.log") -RedirectStandardError (Join-Path $logDir "server.err.log") -WindowStyle Hidden -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:3000/api/health/db" -TimeoutSec 3
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch {}
            if ($srv.HasExited) {
              Get-Content (Join-Path $logDir "server.err.log") -Tail 40 -ErrorAction SilentlyContinue
              throw "Backend server exited early (code $($srv.ExitCode))"
            }
          }
          if (-not $ok) {
            Get-Content (Join-Path $logDir "server.err.log") -Tail 40 -ErrorAction SilentlyContinue
            throw "Backend server did not become healthy on port 3000"
          }
          Write-Host "Backend server healthy on port 3000 (pid $($srv.Id))"

          # 2) Copy release server.exe next to debug app.exe (ensure_server_running)
          $app = Join-Path $env:GITHUB_WORKSPACE "target\debug\app.exe"
          if (-not (Test-Path $app)) { throw "app.exe not found at $app" }
          $dbgServer = Join-Path $env:GITHUB_WORKSPACE "target\debug\server.exe"
          Copy-Item $server $dbgServer -Force

          # 3) Start Tauri app (debug)
          $p = Start-Process -FilePath $app -RedirectStandardOutput (Join-Path $logDir "app.out.log") -RedirectStandardError (Join-Path $logDir "app.err.log") -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 12
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) {
            Write-Host "=== app.err.log tail (app exited) ==="
            Get-Content (Join-Path $logDir "app.err.log") -Tail 60 -ErrorAction SilentlyContinue
            Write-Host "=== app.out.log tail ==="
            Get-Content (Join-Path $logDir "app.out.log") -Tail 60 -ErrorAction SilentlyContinue
            throw "Tauri app exited early (code $($p.ExitCode)) before MCP bridge could start"
          }
          Write-Host "Tauri app alive (PID $($p.Id))"

          # 4) Wait bridge port 9223 + real WS handshake
          $listener = $null
          for ($i = 0; $i -lt 20; $i++) {
            $listener = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -ge 9223 -and $_.LocalPort -le 9422 }
            if ($listener) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $listener) {
            Write-Host "=== app.err.log tail (no bridge listener) ==="
            Get-Content (Join-Path $logDir "app.err.log") -Tail 60 -ErrorAction SilentlyContinue
            Write-Host "=== app.out.log tail ==="
            Get-Content (Join-Path $logDir "app.out.log") -Tail 60 -ErrorAction SilentlyContinue
            throw "MCP bridge did not start on ports 9223-9422"
          }
          $listener | ForEach-Object { Write-Host "MCP bridge listening on port $($_.LocalPort) (pid $($_.OwningProcess), addr $($_.LocalAddress))" }
          $targetAddr = if ($listener[0].LocalAddress -in @("::", "0.0.0.0")) { "127.0.0.1" } else { $listener[0].LocalAddress }
          $wsPath = Join-Path $env:GITHUB_WORKSPACE "tests\node_modules\ws"
          if (-not (Test-Path $wsPath)) { throw "ws library not found at $wsPath (run npm ci in tests/)"; }
          $wsScript = @'
          const WebSocket = require(process.argv[2]);
          const host = process.argv[3] || '127.0.0.1';
          const ws = new WebSocket('ws://' + host + ':9223');
          const t = setTimeout(() => { console.log('WS handshake TIMEOUT at ' + host); process.exit(2); }, 8000);
          ws.on('open', () => { console.log('WS handshake OK at ' + ws.url); clearTimeout(t); ws.close(); process.exit(0); });
          ws.on('error', (e) => { clearTimeout(t); console.log('WS handshake FAIL: ' + e.message); process.exit(1); });
          '@
          $wsFile = Join-Path $logDir "wshandshake.cjs"
          Set-Content -Path $wsFile -Value $wsScript
          node $wsFile "$wsPath" "$targetAddr"

          # 5) Quick health pre-check (app masih hidup + bridge masih listen)
          if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
            Write-Host "=== app.err.log tail ==="
            Get-Content (Join-Path $logDir "app.err.log") -Tail 60 -ErrorAction SilentlyContinue
            Write-Host "=== app.out.log tail ==="
            Get-Content (Join-Path $logDir "app.out.log") -Tail 40 -ErrorAction SilentlyContinue
            throw "app.exe died right after WS handshake"
          }
          Write-Host "pre-test check: app alive (PID $($p.Id)) + bridge 9223 + WS handshake OK"

          # 6) Run E2E tests (di step yang sama, tanpa batas step antar-process)
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "tests")
          try {
            npm run test:all
            if ($LASTEXITCODE -ne 0) { throw "E2E tests failed (exit $LASTEXITCODE)" }
          } finally {
            Pop-Location
          }
          Write-Host "E2E tests PASSED"

          # 7) Cleanup
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $p.Id -Force }
          if (Get-Process -Id $srv.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $srv.Id -Force }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/results/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/results/screenshots/
          retention-days: 14
