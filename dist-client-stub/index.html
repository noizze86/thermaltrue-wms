<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thermaltrue WMS — Connect</title>
  <link rel="stylesheet" href="connect.css" />
</head>
<body>
  <div class="card">
    <h1>Hubungkan ke Server</h1>
    <p class="hint">Masukkan alamat server Thermaltrue WMS di jaringan Anda, atau pindai otomatis.</p>
    <input id="url" type="text" placeholder="IP_SERVER:3000 (contoh: 192.168.1.100:3000)" autocomplete="off" spellcheck="false" />
    <p id="status" class="status"></p>
    <div class="actions">
      <button id="connect" class="primary">Test &amp; Connect</button>
      <button id="scan" class="secondary">Scan Otomatis</button>
    </div>
    <p class="foot">Alamat yang berhasil tersimpan otomatis untuk koneksi berikutnya.</p>
  </div>
  <script src="connect.js"></script>
</body>
</html>
